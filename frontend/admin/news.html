<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Team SouL | News Admin</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/admin.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="admin-header">

    <a
        href="../index.html"
        class="brand">

        <img
            src="../images/team-soul-logo.png"
            alt="Team SouL"
            class="team-logo">

        <span class="brand-text">
            TEAM SOUL
        </span>

    </a>


    <nav class="admin-nav">

        <a href="index.html">
            Dashboard
        </a>

        <a href="players.html">
            Players
        </a>

        <a href="matches.html">
            Matches
        </a>

        <a href="tournaments.html">
            Tournaments
        </a>

        <a
            href="news.html"
            class="active">

            News

        </a>

        <a href="../index.html">
            Website
        </a>

        <a href="media.html">
    Media
</a>

    </nav>

</header>



<!-- =========================
     INTRO
========================= -->

<section class="intro">

    <p class="red">
        TEAM SOUL
    </p>

    <h2>
        NEWS ADMIN
    </h2>

    <p>
        Add and manage Team SouL
        news and announcements.
    </p>

</section>



<!-- =========================
     ADD NEWS
========================= -->

<section class="news-admin-section">

    <div class="news-form-box">

        <p class="admin-label">
            CREATE
        </p>

        <h2>
            ADD NEWS
        </h2>


        <form id="newsForm">


            <label for="title">
                News Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter news title"
                required>


            <label for="image">
                Image URL
            </label>

            <input
                type="text"
                id="image"
                placeholder="Enter image URL">


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                rows="6"
                placeholder="Enter news description"
                required></textarea>


            <button type="submit">
                ADD NEWS
            </button>


        </form>


        <p id="message"></p>

    </div>

</section>



<!-- =========================
     EXISTING NEWS
========================= -->

<section class="news-admin-section">

    <div class="news-admin-heading">

        <p class="admin-label">
            MANAGE
        </p>

        <h2>
            EXISTING NEWS
        </h2>

        <p>
            View and delete published
            Team SouL news.
        </p>

    </div>


    <div
        id="newsContainer"
        class="admin-news-grid">

        <p>
            Loading news...
        </p>

    </div>

</section>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <a
        href="../index.html"
        class="brand">

        <img
            src="../images/team-soul-logo.png"
            alt="Team SouL"
            class="team-logo">

        <span class="brand-text">
            TEAM SOUL
        </span>

    </a>


    <p>
        TEAM SOUL • S8UL ESPORTS
    </p>

</footer>



<script>

const API =
    "https://team-soul-website.onrender.com/api/news";


const form =
    document.getElementById("newsForm");

const message =
    document.getElementById("message");

const container =
    document.getElementById("newsContainer");



/* =========================
   LOAD NEWS
========================= */

async function loadNews() {

    try {

        const response =
            await fetch(API);


        if (!response.ok) {

            throw new Error(
                "Failed to load news"
            );

        }


        const news =
            await response.json();


        container.innerHTML = "";


        if (news.length === 0) {

            container.innerHTML = `
                <p class="empty-news">
                    No news available.
                </p>
            `;

            return;

        }


        news.forEach(item => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "admin-news-card";


            card.innerHTML = `

                ${
                    item.image
                    ?
                    `
                    <img
                        src="${item.image}"
                        alt="${item.title || "News"}">
                    `
                    :
                    `
                    <div class="admin-news-placeholder">
                        SOUL
                    </div>
                    `
                }


                <div class="admin-news-content">

                    <h3>
                        ${item.title || "News"}
                    </h3>


                    <p>
                        ${item.description || ""}
                    </p>


                    <button
                        type="button"
                        onclick="deleteNews(${item.id})"
                        class="delete-news">

                        DELETE

                    </button>

                </div>

            `;


            container.appendChild(card);

        });

    }


    catch (error) {

        console.error(error);


        container.innerHTML = `
            <p class="empty-news">
                Unable to load news.
            </p>
        `;

    }

}



/* =========================
   ADD NEWS
========================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const title =
            document.getElementById(
                "title"
            ).value.trim();


        const image =
            document.getElementById(
                "image"
            ).value.trim();


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        try {

            const response =
                await fetch(API, {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        title: title,

                        description:
                            description,

                        image:
                            image || null

                    })

                });


            if (!response.ok) {

                throw new Error(
                    "Failed to add news"
                );

            }


            message.textContent =
                "News added successfully.";


            message.style.color =
                "#168cff";


            form.reset();


            loadNews();

        }


        catch (error) {

            console.error(error);


            message.textContent =
                "Unable to add news.";


            message.style.color =
                "#ff4444";

        }

    }
);



/* =========================
   DELETE NEWS
========================= */

async function deleteNews(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this news?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API}/${id}`,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to delete news"
            );

        }


        loadNews();

    }


    catch (error) {

        console.error(error);


        alert(
            "Unable to delete news."
        );

    }

}



/* =========================
   START
========================= */

loadNews();

</script>


</body>

</html>
